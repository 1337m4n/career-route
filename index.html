<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="icon" href="./favicon.svg" />
    <meta name="description" content="按事实校准职业、财务与城市迁移路线。所有个人数据只保存在当前浏览器。" />
    <title>路线校准</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#home" aria-label="路线校准，返回今日判断">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M7 27V9h8v7h7V9h7v18h-7v-6h-7v6H7Z" fill="currentColor"/><path d="m11 13 14 10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span><strong>路线校准</strong><small>基于事实，更新选择</small></span>
        </a>
        <nav class="nav-list">
          <button class="nav-item" type="button" data-view="home"><span aria-hidden="true">⌂</span>今日判断</button>
          <button class="nav-item" type="button" data-view="feedback"><span aria-hidden="true">✎</span>填写反馈</button>
          <button class="nav-item" type="button" data-view="offers"><span aria-hidden="true">⇄</span>机会比较</button>
          <button class="nav-item" type="button" data-view="timeline"><span aria-hidden="true">▦</span>时间线</button>
          <button class="nav-item" type="button" data-view="history"><span aria-hidden="true">▤</span>决策记录</button>
          <button class="nav-item" type="button" data-view="settings"><span aria-hidden="true">⚙</span>设置与数据</button>
        </nav>
        <div class="sidebar-foot">单人使用 · 数据只存在本机<br /><span id="app-version">v2.0 MVP</span></div>
      </aside>
      <main id="app" class="main" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
